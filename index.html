<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>顔認証出欠アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <script defer src="js/face-recognition.js"></script>
  <style>
    body { font-family: sans-serif; padding: 1rem; text-align: center; }
    video, canvas { width: 320px; height: 240px; }
    #attendanceForm { display: none; margin-top: 1rem; }
    #authStatus { font-weight: bold; margin: 1rem; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; }
  </style>
</head>
<body>
  <h2>顔認証による出欠確認</h2>
  <div>
    <video id="video" autoplay muted></video>
    <br>
    <button onclick="registerFace()">顔を登録する</button>
    <button onclick="authenticate()">認証して出欠する</button>
    <div id="authStatus"></div>
  </div>

  <form id="attendanceForm">
    <h3>出欠記録フォーム</h3>
    <label>氏名: <input type="text" id="nameInput" required></label><br><br>
    <label>
      <input type="radio" name="status" value="開始" required> 開始
      <input type="radio" name="status" value="終了"> 終了
    </label><br><br>
    <button type="submit">送信</button>
  </form>
</body>
</html>
